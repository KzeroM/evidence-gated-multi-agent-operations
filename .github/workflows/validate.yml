name: Validate reference package

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python validation dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node validation dependencies
        run: npm ci

      - name: Compile Python sources
        run: python -m compileall -q egmo scripts tests

      - name: Validate schemas, examples, links, and working tree
        run: egmo validate --mode working-tree

      - name: Validate tracked files
        run: egmo validate --mode tracked

      - name: Validate Git history blobs
        run: egmo validate --mode history

      - name: Run validator regression tests
        run: npm test

      - name: Build, install, and smoke test package
        run: npm run smoke:package

      - name: Run standard secret scanner
        run: npm run scan:secrets

      - name: Lint Markdown
        run: npm run lint:markdown

      - name: Validate Mermaid diagrams
        run: npm run lint:mermaid

      # Omitting --as-of replays freshness at reviewed_at, so template dates remain self-contained.
      - name: Smoke test CLI judgment at embedded review time
        run: >-
          egmo judge templates/mission.yaml templates/execution-record.yaml
          templates/evidence.yaml templates/critic-review.yaml templates/final-report.yaml
