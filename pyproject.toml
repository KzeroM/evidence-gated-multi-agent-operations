[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "egmo-reference"
version = "2.0.0"
description = "Vendor-neutral evidence-gated operations protocol validator"
requires-python = ">=3.11"
dependencies = ["jsonschema[format]>=4.21", "PyYAML>=6.0"]

[project.scripts]
egmo = "egmo.cli:main"

[tool.setuptools]
packages = ["egmo"]

[tool.setuptools.data-files]
"share/egmo" = ["sanitization-policy.yaml"]
"share/egmo/schemas" = ["schemas/*.json"]
"share/egmo/templates" = ["templates/*.yaml"]
